name: Lantern CI & Mandatory Browser E2E

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  locked-unit-and-browser-e2e:
    # Keep the locked Python 3.12.10 toolchain available; ubuntu-latest
    # advanced to 26.04 before that interpreter was published for the image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify locked uv manifest & CLI smoke (P1-05)
        run: |
          uv lock --check
          uv sync --locked --no-dev
          uv run --locked main.py --help

      - name: Install Chromium and Edge channels for mandatory browser E2E gate (P1-06)
        run: |
          uv run --locked --with playwright --with pillow python -m playwright install chromium msedge --with-deps

      - name: Run focused Sol P0/P1 regressions & browser refresh suite
        env:
          LANTERN_E2E: "1"
          LANTERN_BROWSER_UNIT: "1"
          LANTERN_CI_REQUIRE_BROWSER: "1"
        run: |
          uv run --locked --with playwright --with pillow python -m unittest tests.test_v925_gallery_explorer -v
          uv run --locked --with playwright --with pillow python -m unittest tests.test_list_refresh_e2e -v

      - name: Run full repository unittest discovery + mandatory browser CI gate
        env:
          LANTERN_E2E: "1"
          LANTERN_BROWSER_UNIT: "1"
          LANTERN_CI_REQUIRE_BROWSER: "1"
        run: |
          uv run --locked --with playwright --with pillow python scripts/run_ci.py --require-browser
