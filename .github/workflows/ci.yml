name: Lantern CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml watchdog pillow

      - name: Run JavaScript syntax, unit, contract and fake-Pi HTTP integration tests
        run: python scripts/run_ci.py

      - name: Smoke-test Markdown build with locked dependencies
        run: |
          npm ci
          npm run build:markdown
